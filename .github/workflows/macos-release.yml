name: Build macOS DMGs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to receive the client and server DMGs
        required: true
        default: v1.0.16
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      VCPKG_DISABLE_METRICS: '1'
      COCOAPODS_DISABLE_STATS: 'true'
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install native build tools
        run: |
          brew install llvm@18 cmake ninja autoconf automake libtool pkg-config
          if ! command -v pod >/dev/null; then brew install cocoapods; fi
          sudo softwareupdate --install-rosetta --agree-to-license
          echo "VCPKG_ROOT=$RUNNER_TEMP/remotedisplay-vcpkg" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm@18)/lib" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.24.5'
          architecture: arm64
          cache: true

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.89.0'

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: engine/rustdesk -> target
          cache-on-failure: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/vcpkg/archives
            ~/.cache/vcpkg/archives
          key: macos-arm64-vcpkg-120deac-${{ hashFiles('engine/rustdesk/res/vcpkg/**') }}

      - name: Build client and server DMGs (no tests)
        run: bash release/build-macos-ci.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-arm64-dmgs
          path: |
            release/out/*.dmg
            release/out/*build-info.txt
            release/out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach DMGs to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            release/out/*.dmg release/out/*build-info.txt release/out/SHA256SUMS.txt --clobber
          echo "Client and server DMGs uploaded to $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Apple silicon; ad-hoc signed; not notarized; tests skipped." >> "$GITHUB_STEP_SUMMARY"
